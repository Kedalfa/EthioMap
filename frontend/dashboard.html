<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EthioMap | Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css?v=20260829-mobile-icon-menu">
  <link rel="stylesheet" href="css/theme.css?v=20260826-nav-active">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="Ethiomap.html">
      <span class="brand-mark">E</span>
      <span><strong>EthioMap</strong><small>Map Information Subsystem</small></span>
    </a>
    <nav class="top-nav">
      <a href="Ethiomap.html" class="nav-link nav-item">Map</a>
      <a href="about.html" class="nav-link nav-item">About Us</a>
      <a href="dashboard.html" class="nav-link nav-item active" aria-current="page">Dashboard</a>
      <button class="profile-nav" type="button" aria-label="Open account menu"></button>
    </nav>
  </header>
  <main class="dash-main">
    <div class="dash-intro">
      <div class="sidebar-heading">
        <div>
          <div id="dashboard-eyebrow" class="eyebrow">Admin Dashboard</div>
          <p id="dashboard-description">Manage datasets, users, and system activity from here.</p>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="true"
          aria-label="Collapse dashboard navigation" title="Collapse navigation" onclick="toggleDashboardSidebar()">
          <svg class="desktop-sidebar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m15 5-7 7 7 7"></path>
          </svg>
          <svg class="mobile-sidebar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
      </div>
    </div>
    <h1 id="welcome-title" class="dashboard-welcome">Welcome back</h1>
    <!-- Stat cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <span class="stat-label">Datasets</span>
        <span id="stat-datasets" class="stat-value">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active Users</span>
        <span id="stat-users" class="stat-value">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Actions</span>
        <span id="stat-actions" class="stat-value">—</span>
      </div>
    </div>
    <!-- Navigation tiles rendered dynamically by sidebar.js -->
    <div class="tile-grid"></div>
    <!-- Recent activity -->
    <section class="recent-section admin-only">
      <div class="section-head">
        <h2>Recent Activity</h2><a href="activity-log.html" class="view-all">View all →</a>
      </div>
      <div id="recent-list" class="recent-list">
        <div class="empty-state">Loading…</div>
      </div>
    </section>
  </main>
  <script>
    function toggleDashboardSidebar() {
      const dashboard = document.querySelector('.dash-main');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const isCollapsed = dashboard.classList.toggle('sidebar-collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!isCollapsed));
      sidebarToggle.setAttribute('aria-label', isCollapsed ? 'Expand dashboard navigation' : 'Collapse dashboard navigation');
      sidebarToggle.title = isCollapsed ? 'Expand navigation' : 'Collapse navigation';
    }
  </script>
  <script type="module">
    import { requireAuth } from './js/auth.js';
    const API_BASE = window.ETHIOMAP_API_BASE || 'http://localhost:4000';


    const user = await requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('welcome-title').textContent = `Welcome back, ${user.username}`;
    document.getElementById('dashboard-eyebrow').textContent = user.role === 'admin' ? 'Admin Dashboard' : 'Standard User Dashboard';
    document.getElementById('dashboard-description').textContent = user.role === 'admin'
      ? 'Manage datasets, users, and system activity from here.'
      : 'Manage datasets.';

    // Hide admin-only sections for regular users
    if (user.role !== 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
    }

    // Load stats
    if (user.role === 'admin') {
      try {
        const token = localStorage.getItem('ethiomap_token');
        const res = await fetch(`${API_BASE}/api/logs/stats`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) {
          const s = await res.json();
          document.getElementById('stat-datasets').textContent = s.totalDatasets;
          document.getElementById('stat-users').textContent = s.totalUsers;
          document.getElementById('stat-actions').textContent = s.totalActions;
          const list = document.getElementById('recent-list');
          if (s.recentActivity.length) {
            list.innerHTML = s.recentActivity.map(a => `
              <div class="recent-row">
                <span class="recent-action action-${a.action}">${a.action}</span>
                <span class="recent-who">${a.username || '—'}</span>
                <span class="recent-what">${a.resource_name || '—'}</span>
                <span class="recent-when">${new Date(a.created_at).toLocaleString()}</span>
              </div>`).join('');
          } else {
            list.innerHTML = '<div class="empty-state">No activity yet.</div>';
          }
        }
      } catch { }
    } else {
      // Non-admin: just show dataset count
      try {
        const res = await fetch(`${API_BASE}/api/datasets`);
        if (res.ok) { const d = await res.json(); document.getElementById('stat-datasets').textContent = d.length; }
      } catch { }
      document.getElementById('stat-users').closest('.stat-card').style.display = 'none';
      document.getElementById('stat-actions').closest('.stat-card').style.display = 'none';
    }
  </script>
  <script type="module" src="js/sidebar.js?v=20260826-mobile-dash-gap"></script>
  <script type="module" src="js/profile-menu.js"></script>
</body>

</html>
