<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2d">
  <title>EthioMap | Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="Ethiomap.html"><span class="brand-mark">E</span><span><strong>EthioMap</strong><small>Map Information Subsystem</small></span></a>
  <nav class="top-nav">
    <a class="nav-link" href="Ethiomap.html">Map</a>
    <a class="nav-link" href="about.html">About Us</a>
  </nav>
</header>
<main class="login-main">
  <div class="login-container">
  <div class="logo">
    <h1>EthioMap</h1>
    <p>Map Information Subsystem</p>
  </div>
  <div class="login-card">
    <h2>Sign in</h2>
    <p class="subtitle">Sign in to upload and manage spatial datasets.</p>
    <div id="login-error" class="login-error" role="alert" hidden></div>
    <form id="login-form" autocomplete="on" novalidate>
      <div class="input-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" name="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button id="login-submit" type="submit">Sign in</button>
    </form>
    <a href="Ethiomap.html" class="back">← Back to Map</a>
  </div>
</div>
</main>
<script src="js/login.js"></script>
</body>
</html>
