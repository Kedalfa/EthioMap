<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EthioMap | Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html"><span class="brand-mark">E</span><span><strong>EthioMap</strong><small>Map Information Subsystem</small></span></a>
    <nav class="top-nav">
      <a href="Ethiomap.html" class="nav-link">Map</a>
      <a href="about.html" class="nav-link">About Us</a>
      <a href="dashboard.html" class="nav-link">← Dashboard</a>
      <button id="logout-btn" class="logout-btn" type="button">Sign out</button>
      <a href="profile.html" class="nav-link profile-nav" aria-label="Open profile" title="Profile"><svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"></path></svg></a>
    </nav>
  </header>

  <main class="page">
    <div class="page-heading">
      <div>
        <div class="eyebrow">Account</div>
        <h1>My Profile</h1>
        <p>View your EthioMap account information and access level.</p>
      </div>
    </div>

    <section class="profile-card" aria-labelledby="profile-heading">
      <div class="profile-avatar" id="profile-avatar" aria-hidden="true">E</div>
      <div class="profile-details">
        <h2 id="profile-heading">Account details</h2>
        <div class="profile-field"><span>Username</span><strong id="profile-username">Loading...</strong></div>
        <div class="profile-field"><span>Email</span><strong id="profile-email">Loading...</strong></div>
        <div class="profile-field"><span>Role</span><strong id="profile-role" class="role-badge">Loading...</strong></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireAuth, logout } from './js/auth.js';

    document.getElementById('logout-btn').addEventListener('click', logout);
    const user = await requireAuth();
    if (!user) throw new Error('Not authenticated');

    document.getElementById('profile-username').textContent = user.username;
    document.getElementById('profile-email').textContent = user.email;
    const role = document.getElementById('profile-role');
    role.textContent = user.role === 'admin' ? 'Administrator' : 'User';
    role.classList.add(`role-${user.role}`);
    document.getElementById('profile-avatar').textContent = user.username.charAt(0).toUpperCase();
  </script>
</body>
</html>
