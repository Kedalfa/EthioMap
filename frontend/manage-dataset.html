<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EthioMap | Manage Datasets</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/manage-dataset.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="Ethiomap.html"><span class="brand-mark">E</span><span><strong>EthioMap</strong><small>Map Information Subsystem</small></span></a>
    <a class="back-link" href="Ethiomap.html">Back to map</a>
  </header>
  <main class="page">
    <div class="page-heading">
      <div><div class="eyebrow">Dataset management</div><h1>Manage map layers</h1><p>Review, edit, or remove the datasets available on your map.</p></div>
      <span id="dataset-count" class="tag">0 datasets</span>
    </div>
    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    <section id="dataset-list" class="dataset-list" aria-live="polite"></section>
  </main>
  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2>Dataset's Metadata</h2>
      <label>Dataset name<input id="edit-name" required maxlength="255"></label>
      <label>Description<textarea id="edit-description" maxlength="2000" rows="3"></textarea></label>
      <label>Coordinate reference system<input id="edit-crs" maxlength="100" placeholder="EPSG:4326"></label>
      <label>Owner<input id="edit-owner" maxlength="255"></label>
      <label>Source<input id="edit-source" maxlength="500"></label>
      <div class="dialog-actions"><button id="edit-cancel" type="button">Cancel</button><button class="primary" type="submit">Save changes</button></div>
    </form>
  </dialog>
  <script src="js/manage-dataset.js"></script>
</body>
</html>
